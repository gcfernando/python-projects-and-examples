# GitHub Pages documentation site; does not configure application deployment.
url: "https://gcfernando.github.io"
baseurl: "/python-projects-and-examples"
title: "Python Projects and Code Examples"
description: "Python examples for automation, networking, desktop interfaces, media processing, machine learning and local web dashboards."
lang: "en"
plugins:
  - jekyll-sitemap
exclude:
  - packages
  - bin
  - obj
  - node_modules
  - vendor
  - tests
  - .claude
  - .agents
  - .codex
defaults:
  - scope:
      path: "Async HTTP/readme.md"
    values:
      title: "Async HTTP Requests in Python with aiohttp"
      description: "Send asynchronous GET, POST, PUT and DELETE requests to a sample REST API from an interactive Python client using aiohttp and asyncio."
  - scope:
      path: "Bookmark/readme.md"
    values:
      title: "Python Bookmark Manager with SQLite and Rich"
      description: "Save, search, edit, delete and open bookmarks with notes in a local SQLite database, using a Python command-line interface and Rich output."
  - scope:
      path: "Custom Exception/readme.md"
    values:
      title: "Create and Catch a Custom Exception in Python"
      description: "A minimal Python example demonstrating how to define, raise, and catch a custom exception class by subclassing Exception."
  - scope:
      path: "Database/README.md"
    values:
      title: "Python dbm — A File-Based Key-Value Database"
      description: "Store and retrieve a small record with Python dbm, a file-based key-value database in the standard library that needs no database server."
  - scope:
      path: "Extract CPU Information/readme.md"
    values:
      title: "Read CPU Information with Python and psutil"
      description: "Read processor model, architecture, frequency and physical or logical core counts in Python with psutil and py-cpuinfo."
  - scope:
      path: "FixNetwork/readme.md"
    values:
      title: "Windows Network Diagnostics and Reset with Python"
      description: "Review a Python Windows network repair utility for DHCP, DNS, Winsock, proxy and adapter troubleshooting, including reset precautions."
  - scope:
      path: "Graphite_CLI/README.md"
    values:
      title: "Graphite CLI — Photo to Pencil Sketch with Python"
      description: "Convert photos to graphite pencil sketches with a Python CLI using OpenCV, NumPy and Pillow, automatic rendering settings and PNG or JPEG output."
  - scope:
      path: "GUI_Apps/README.md"
    values:
      title: "Python Contact Book — Tkinter and SQL Server"
      description: "Explore a contact manager built with Tkinter, ttkbootstrap, pyodbc and SQL Server stored procedures for creating, searching and editing contacts."
  - scope:
      path: "Health Monitor/readme.md"
    values:
      title: "Monitor Process Memory in Python with psutil"
      description: "Watch process memory usage in a live Python terminal dashboard with psutil and Rich, using growth heuristics to flag possible memory leaks."
  - scope:
      path: "Image to ASCII/readme.md"
    values:
      title: "Convert Images to ASCII Art with Python"
      description: "Convert an image into a text-file ASCII preview with a short pywhatkit example, then review the installed library's API and input requirements."
  - scope:
      path: "Image2Cartoon/readme.md"
    values:
      title: "Turn Photos into Cartoons with Python and OpenCV"
      description: "Turn a photo into a cartoon-style image with OpenCV median blur, adaptive thresholding and a bilateral filter in a short Python example."
  - scope:
      path: "Improve MP3 Quality/readme.md"
    values:
      title: "Re-encode MP3 Files with Python, pydub and FFmpeg"
      description: "Change MP3 bitrate, channels and sample rate with a Python pydub and FFmpeg tool for files or folders; review its in-place replacement behavior."
  - scope:
      path: "Internet Speed Test/readme.md"
    values:
      title: "Test Internet Speed with Python and speedtest-cli"
      description: "Measure download speed, upload speed and latency with a Python speedtest-cli example. Review the script's reported-unit limitation before interpreting results."
  - scope:
      path: "LoadLibraries/readme.md"
    values:
      title: "Call a C# DLL from Python with pythonnet"
      description: "Load a compiled .NET library from Python with pythonnet and clr. Review matching runtime and library-build requirements before running the example."
  - scope:
      path: "Lyrics/readme.md"
    values:
      title: "Search Genius Songs with Python and lyricsgenius"
      description: "Search Genius song metadata with Python and lyricsgenius, display a lyrics preview and review API configuration and response limitations."
  - scope:
      path: "ML/COVID Forecast/readme.md"
    values:
      title: "Time-Series Forecasting with ARIMA and SARIMAX"
      description: "Explore a Python time-series forecast using auto-ARIMA, SARIMAX, stationarity tests and confidence intervals with historical COVID-19 case data."
  - scope:
      path: "ML/README.md"
    values:
      title: "Python Machine Learning: Forecasting and Regression"
      description: "Learn from two Python examples: COVID-19 time-series forecasting with auto-ARIMA and SARIMAX, and salary prediction with scikit-learn regression."
  - scope:
      path: "ML/Salary/readme.md"
    values:
      title: "Salary Regression with Python and scikit-learn"
      description: "Train a scikit-learn salary regression model from years of experience, save the model and scaler with joblib, and load them for predictions."
  - scope:
      path: "MP3 Player/readme.md"
    values:
      title: "Python MP3 Player with pygame and Crossfade"
      description: "Explore a console MP3 player using pygame and mutagen, with shuffled playback, track preloading and documented crossfade behavior."
  - scope:
      path: "MP3 Tags/readme.md"
    values:
      title: "Read MP3 ID3 Tags in Python with eyeD3"
      description: "Read MP3 title, artist, album, genre and track metadata with eyeD3 in Python, along with bitrate, sample rate, duration and channel information."
  - scope:
      path: "Object Clone/readme.md"
    values:
      title: "Clone Python Objects with copy.deepcopy"
      description: "Compare an original object and its deep copy in Python, change the original and inspect independent values with a minimal copy.deepcopy example."
  - scope:
      path: "Password Utility/readme.md"
    values:
      title: "Python Password Generator and Strength-Check Examples"
      description: "Explore two Python CLI examples: generate passwords with character-count requirements and estimate password strength from possible combinations."
  - scope:
      path: "Port Scanner/readme.md"
    values:
      title: "Python TCP Port Scanner — IPv6 and JSON Output"
      description: "Scan authorized IPv4 and IPv6 hosts with a multithreaded Python TCP scanner, optional service banners and JSON output using the standard library."
  - scope:
      path: "QR Code/readme.md"
    values:
      title: "Generate Custom QR Codes with Python"
      description: "Generate a QR code with Python's qrcode library, choose foreground and background colors and save the result as a PNG image."
  - scope:
      path: "README.md"
    values:
      title: "Python Projects — Automation, Media and Machine Learning"
      description: "Explore Python examples for automation, networking, desktop apps, image and audio processing, and machine learning. Follow each project's setup and limitations."
  - scope:
      path: "Remove Background/readme.md"
    values:
      title: "Remove Image Backgrounds with Python and rembg"
      description: "Remove an image background with rembg and composite the subject onto black with Pillow. Review model downloads, file paths and runtime requirements."
  - scope:
      path: "SetupWizard/readme.md"
    values:
      title: "Fruit Wiki — Python Image Viewer and Packaging Demo"
      description: "Build a fruit image viewer with PySimpleGUI and Pillow, and learn how a resource path helper locates bundled assets in PyInstaller packages."
  - scope:
      path: "Simple Selenium Scraper/readme.md"
    values:
      title: "Python Selenium Scraper with Headless Chrome"
      description: "A short Selenium web scraping example in Python that runs Chrome in headless mode, opens the ESPN Cricinfo news page, and prints the page header and news headlines found by CSS class."
  - scope:
      path: "Simple WhatApp Sender/readme.md"
    values:
      title: "Schedule WhatsApp Messages with Python and pywhatkit"
      description: "A short Python script that shows how to schedule and send a WhatsApp message from Python with the pywhatkit library, which automates WhatsApp Web in your browser."
  - scope:
      path: "Stenography/readme.md"
    values:
      title: "Hide and Read Text in PNG Images with Python"
      description: "Hide a text message in a PNG image and read it back with the stegano library, using a short Python example of least significant bit steganography."
  - scope:
      path: "StoryReader/readme.md"
    values:
      title: "Read a PDF Aloud with Python and pyttsx3"
      description: "Extract text from PDF pages with PyPDF2 and read it aloud with pyttsx3 using the operating system text-to-speech voices in a Python example."
  - scope:
      path: "Streamlit/readme.md"
    values:
      title: "Streamlit in Python — Widgets, DataFrames and Charts"
      description: "Explore Streamlit sidebar widgets, a pandas DataFrame, a matplotlib histogram and native line and area charts in a single-file Python app."
  - scope:
      path: "TagClouds/readme.md"
    values:
      title: "Create Masked Word Clouds from Web Pages in Python"
      description: "Collect web-page text and generate an image-shaped word cloud in Python with requests, inscriptis, wordcloud and matplotlib."
  - scope:
      path: "Text2Audio/readme.md"
    values:
      title: "Python Text-to-Speech App with gTTS"
      description: "Convert typed text to speech in a CustomTkinter Python desktop app with gTTS language and accent options and audio playback through pygame."
  - scope:
      path: "Use Twilio/readme.md"
    values:
      title: "Python Twilio Examples — SMS, WhatsApp and Calls"
      description: "Explore a Python CLI for Twilio SMS, WhatsApp and voice-call requests, with account configuration, credential handling and usage notes."
  - scope:
      path: "Use Windows Login/readme.md"
    values:
      title: "Check Windows Credentials with Python and pywin32"
      description: "Study a Python win32security.LogonUser example for checking Windows credentials, including its input handling and authentication-boundary limitations."
  - scope:
      path: "Wifi Profiles/readme.md"
    values:
      title: "Manage Windows Wi-Fi Profiles with Python and netsh"
      description: "Review a Python netsh utility for listing saved Wi-Fi credentials and deleting profiles. Use it only on networks and machines you administer."
  - scope:
      path: "Wifi Radar/readme.md"
    values:
      title: "WiFi Radar — Python Scanner and Flask Dashboard"
      description: "Display nearby Wi-Fi access points in a local Flask radar dashboard with signal strength, security details, vendor lookup and CSV export."
  - scope:
      path: "Wifi Scanner/readme.md"
    values:
      title: "Scan Nearby Wi-Fi Networks with Python and pywifi"
      description: "Scan nearby Wi-Fi networks with a Python pywifi example and inspect SSID, signal, frequency and security fields alongside documented platform limitations."
  - scope:
      path: "Wifi Radar/index.html"
    values:
      sitemap: false

# Public documentation navigation and presentation.
repository: gcfernando/python-projects-and-examples
theme: jekyll-theme-primer
projects_hub: https://gcfernando.github.io/gcfernando/projects/
project_category: "Learn & utilities"
